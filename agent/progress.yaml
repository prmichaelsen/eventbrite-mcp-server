      file: agent/tasks/SEC-001-remove-dev-token-fallback.md
      status: open
      blocking: production deployment
      
    - id: SEC-002
      priority: medium
      title: Add input validation for configuration
      file: agent/tasks/SEC-002-add-input-validation.md
      status: open
      blocking: production deployment
      
    - id: SEC-003
      priority: medium
      title: Update production logging for HTTPS
      file: agent/tasks/SEC-003-update-production-logging.md
      status: open
