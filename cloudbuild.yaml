steps:
  # Build Docker image using Dockerfile (same as local)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eventbrite-mcp-server:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eventbrite-mcp-server:latest'
      - '.'
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/eventbrite-mcp-server:$BUILD_ID'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/eventbrite-mcp-server:latest'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'eventbrite-mcp-server'
      - '--image=gcr.io/$PROJECT_ID/eventbrite-mcp-server:$BUILD_ID'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=60s'
      - '--set-env-vars=NODE_ENV=production,PLATFORM_URL=https://agentbase.me'
      - '--update-secrets=PLATFORM_SERVICE_TOKEN=eventbrite-platform-service-token:latest'

images:
  - 'gcr.io/$PROJECT_ID/eventbrite-mcp-server:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/eventbrite-mcp-server:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
